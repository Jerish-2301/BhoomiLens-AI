version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: bhoomilens-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bhoomilens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bhoomilens-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
